<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mouse Gestures</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="popup-header">
        <div class="brand">
          <img src="icons/icon32.png" alt="" class="brand-icon" />
          <span class="brand-name">Mouse Gestures</span>
        </div>
        <a
          id="rateBtn"
          class="rate-btn"
          href="https://chromewebstore.google.com/detail/dgbdenjbggcneeckccphhadpldndjgbl/reviews"
          target="_blank"
          rel="noopener noreferrer"
          title="Rate on Chrome Web Store"
          aria-label="Rate on Chrome Web Store"
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>Rate</span>
        </a>
      </header>

      <section class="toggles-section">
        <label class="setting">
          <span class="setting-label">Show Trailing Line</span>
          <input id="showTrail" type="checkbox" />
        </label>
        <label class="setting">
          <span class="setting-label">Show Action Hint</span>
          <input id="showGestureName" type="checkbox" />
        </label>
      </section>

      <section class="gestures-section">
        <div class="section-heading">
          <span class="section-title">Common Gestures</span>
          <button id="customizeBtn" class="link-btn" type="button" title="Configure gestures in settings" aria-label="Configure gestures in settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
        <div id="gestureGrid" class="gesture-grid"></div>
      </section>
    </div>
    <script src="actions.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
